<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema El Sentir</title>
    <style>
        body {
            background-color: #030308;
            color: #00f2ff;
            font-family: monospace;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .interactive-node {
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .interactive-node:hover {
            transform: scale(1.05);
        }

        #status-log {
            margin-top: 20px;
            font-size: 14px;
            color: #ff007f;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>SISTEMA EL SENTIR</h1>
    <p>Toca el nodo central para ejecutar la acción en segundo plano</p>

    <!-- Gráfico SVG Interactivo -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="400" height="400">
      <defs>
        <radialGradient id="luzInvisible" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
          <stop offset="20%" stop-color="#00f2ff" stop-opacity="0.8" />
          <stop offset="50%" stop-color="#7000ff" stop-opacity="0.5" />
          <stop offset="100%" stop-color="#000000" stop-opacity="1" />
        </radialGradient>
        <filter id="glow">
          <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
          <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <rect width="800" height="800" fill="#030308" />
      <circle cx="400" cy="400" r="380" fill="url(#luzInvisible)" />

      <!-- Red de procesamiento visual -->
      <g stroke="#8a2be2" stroke-width="1" opacity="0.6">
        <circle cx="400" cy="400" r="200" fill="none" stroke-dasharray="4,8" />
        <circle cx="400" cy="400" r="120" fill="none" stroke="#00f2ff" />
      </g>

      <!-- Nodo Interactivo (El Sentir) -->
      <g id="sentir-btn" class="interactive-node" filter="url(#glow)">
        <circle cx="400" cy="400" r="45" fill="#ffffff" opacity="0.9" />
        <circle cx="400" cy="400" r="20" fill="#ff007f" />
        <circle cx="400" cy="400" r="8" fill="#000000" />
        <text x="400" y="404" font-family="monospace" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="bold">
          EL SENTIR
        </text>
      </g>
    </svg>

    <div id="status-log">Estado: Esperando interacción...</div>

    <!-- Conexión del Front-end con el Script de Fondo -->
    <script>
        const sentirBtn = document.getElementById('sentir-btn');
        const statusLog = document.getElementById('status-log');

        sentirBtn.addEventListener('click', async () => {
            statusLog.innerText = "Procesando transacción en segundo plano...";

            try {
                // Llamada a tu API de servidor / script ejecutor
                const response = await fetch('/api/ejecutar-transaccion', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: 'user_123' })
                });

                const data = await response.json();
                if (data.success) {
                    statusLog.innerText = `Transacción realizada con éxito: ${data.txHash}`;
                } else {
                    statusLog.innerText = "Error al procesar en segundo plano.";
                }
            } catch (error) {
                statusLog.innerText = "Error de conexión con el backend.";
            }
        });
    </script>
</body>
</html>
